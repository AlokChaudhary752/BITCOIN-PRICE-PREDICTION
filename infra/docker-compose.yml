version: "3.8"

services:
  # ==========================================
  # 1. API BACKEND
  # ==========================================
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: btc-oracle-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://oracle:oracle_secure_password@postgres:5432/btc_oracle
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - JWT_SECRET=production-institutional-oracle-secret-key-replace-in-env
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oracle-network

  # ==========================================
  # 2. WEB FRONTEND
  # ==========================================
  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    container_name: btc-oracle-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - oracle-network

  # ==========================================
  # 3. POSTGRESQL / TIMESCALEDB
  # ==========================================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: btc-oracle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oracle
      POSTGRES_PASSWORD: oracle_secure_password
      POSTGRES_DB: btc_oracle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oracle -d btc_oracle"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oracle-network

  # ==========================================
  # 4. REDIS (Cache & Rate Limiting)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: btc-oracle-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oracle-network

  # ==========================================
  # 5. MLFLOW MODEL REGISTRY
  # ==========================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    container_name: btc-oracle-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow-artifacts
    volumes:
      - mlflow_data:/mlflow-artifacts
    networks:
      - oracle-network

  # ==========================================
  # 6. PROMETHEUS
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: btc-oracle-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - oracle-network

  # ==========================================
  # 7. GRAFANA DASHBOARDS
  # ==========================================
  grafana:
    image: grafana/grafana:10.3.3
    container_name: btc-oracle-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_institutional
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - oracle-network

networks:
  oracle-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
