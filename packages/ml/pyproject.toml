[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-oracle-ml"
version = "1.0.0"
description = "Institutional-grade probabilistic Bitcoin forecasting engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "hmmlearn>=0.3.2",
    "shap>=0.45.0",
    "torch>=2.2.0",
    "mapie>=0.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "joblib>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["btc_oracle_ml*"]
